name: ZAIRIS secret scan

on:
  push:
    branches:
      - chatgpt/zairis-recover-scan

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check existing Cloudflare credentials safely
        shell: bash
        env:
          T1: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          T2: ${{ secrets.CF_API_TOKEN }}
          K1: ${{ secrets.CLOUDFLARE_API_KEY }}
          K2: ${{ secrets.CF_API_KEY }}
          E1: ${{ secrets.CLOUDFLARE_EMAIL }}
          E2: ${{ secrets.CF_EMAIL }}
        run: |
          set -u
          TOKEN="${T1:-${T2:-}}"; KEY="${K1:-${K2:-}}"; EMAIL="${E1:-${E2:-}}"
          if [ -n "$TOKEN" ]; then AUTH=(-H "Authorization: Bearer ${TOKEN}"); echo 'AUTH_PRESENT=TOKEN';
          elif [ -n "$KEY" ] && [ -n "$EMAIL" ]; then AUTH=(-H "X-Auth-Email: ${EMAIL}" -H "X-Auth-Key: ${KEY}"); echo 'AUTH_PRESENT=GLOBAL_KEY';
          else echo 'AUTH_PRESENT=NO'; exit 1; fi
          curl -fsS "${AUTH[@]}" 'https://api.cloudflare.com/client/v4/accounts?per_page=100' -o /tmp/accounts.json || { echo 'AUTH_VALID=NO'; exit 1; }
          echo 'AUTH_VALID=YES'
          python3 - <<'PY' >/tmp/ids
          import json
          for x in json.load(open('/tmp/accounts.json')).get('result',[]):
              if x.get('id'): print(x['id'])
          PY
          found=0
          while read -r aid; do
            [ -n "$aid" ] || continue
            code=$(curl -sS -o /tmp/script -w '%{http_code}' "${AUTH[@]}" "https://api.cloudflare.com/client/v4/accounts/${aid}/workers/scripts/news")
            if [ "$code" = 200 ]; then
              found=1; echo 'WORKER_FOUND=YES'; wc -c /tmp/script | awk '{print "SCRIPT_BYTES=" $1}'
              curl -fsS "${AUTH[@]}" "https://api.cloudflare.com/client/v4/accounts/${aid}/workers/scripts/news/schedules" -o /tmp/schedules.json || true
              python3 - <<'PY'
          import json
          try:
              d=json.load(open('/tmp/schedules.json'))
              print('CRONS='+','.join(x.get('cron','') for x in d.get('result',{}).get('schedules',[])))
          except Exception: print('CRONS=UNKNOWN')
          PY
              break
            fi
          done </tmp/ids
          [ "$found" = 1 ] || echo 'WORKER_FOUND=NO'
          exit 1
